version: '3.7'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2 # Use a specific version
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181" # Expose ZK port only if needed for external tools, usually not needed for container-to-container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  kafka-1:
    image: confluentinc/cp-kafka:7.3.2 # Use a specific version matching ZK
    container_name: kafka-1
    hostname: kafka-1
    depends_on:
      - zookeeper
    ports:
      # Port for clients connecting from *outside* the Docker network (e.g., your host machine if needed)
      - "19092:19092"
      # Port for clients connecting from *inside* the Docker network (our producer/consumer containers)
      # - "9092:9092" # Not strictly needed to expose this one to host
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # Listeners:
      # - LISTENER_INTERNAL: For broker-to-broker and within-Docker communication
      # - LISTENER_EXTERNAL: For communication from outside the Docker network (host machine)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_INTERNAL:PLAINTEXT,LISTENER_EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: LISTENER_INTERNAL://kafka-1:9092,LISTENER_EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2 # Needs to be <= number of brokers
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100 # Speed up rebalance for POC
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2 # Needs to be <= number of brokers
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # Needs to be <= number of brokers
      # Auto create topics for simplicity in POC
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - kafka-net

  kafka-2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-2
    hostname: kafka-2
    depends_on:
      - zookeeper
    ports:
      - "19093:19093" # External port for kafka-2
      # - "9093:9093" # Internal port (use different if needed, but not necessary for this setup)
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_INTERNAL:PLAINTEXT,LISTENER_EXTERNAL:PLAINTEXT
      # Use 9092 as the internal port for simplicity, but advertise different external port
      KAFKA_ADVERTISED_LISTENERS: LISTENER_INTERNAL://kafka-2:9092,LISTENER_EXTERNAL://localhost:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - kafka-net

  producer:
    build:
      context: ./producer
    container_name: producer
    depends_on:
      - kafka-1
      - kafka-2
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092 # Use internal listener addresses
      TOPIC_A: "topic-a"
      TOPIC_B: "topic-b"
    networks:
      - kafka-net

  consumer-group-1:
    build:
      context: ./consumer
    container_name: consumer-group-1
    depends_on:
      - kafka-1
      - kafka-2
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092 # Use internal listener addresses
      GROUP_ID: "my-first-group"
      TOPICS: "topic-a,topic-b" # Consume from both topics
    networks:
      - kafka-net

  consumer-group-2:
    build:
      context: ./consumer # Reuse the same consumer code/image
    container_name: consumer-group-2
    depends_on:
      - kafka-1
      - kafka-2
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092 # Use internal listener addresses
      GROUP_ID: "my-second-group" # Different group ID
      TOPICS: "topic-a" # Consume only from topic-a
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge